name: pdf-shrink
label: PDF Shrink
version: 1.0.2
manifest_version: 2
author: Hazem Samak
license: MIT
homepage: https://github.com/Hazem-Samak/hermes-pdf-shrink
description: >-
  Shrink a PDF to a size limit (2 MB, 500 KB, whatever the upload form says)
  entirely on your own machine — no upload, no API key, no third-party service.
  Writes a new file, never the original, and refuses to overwrite an existing
  one. Images it can re-encode safely are downsampled to the resolution they are
  actually displayed at, then a measured quality ladder runs until the file
  fits. When the limit cannot be reached without making the document unreadable
  it says so, reports the smallest safe size, and saves the best safe copy when
  it is meaningfully smaller instead of degrading the document. Includes a
  before/after preview image when PDFium is available, and a size breakdown of
  what makes a PDF heavy. Works with read-only source folders: full-size ladder
  rungs are built in the system temp directory, never beside the PDF, and the
  default output falls back to the current directory when the source folder
  cannot be written.
requires_hermes: ">=0.22.0"
tags: [pdf, documents, compression, files, privacy, local]
provides_tools:
  - pdf_shrink
  - pdf_inspect
provides_hooks: []
python_dependencies:
  - "pikepdf>=10.0,<11"
  - "pypdfium2>=5.0,<6"
  - "pillow>=11,<15"
